appId: org.osiris.desktop
productName: Osiris
directories:
  output: desktop/dist
  buildResources: desktop/build
files:
  - desktop/main.mjs
  - desktop/preload.mjs
  - desktop/lib/**/*
extraResources:
  # Default electron-builder patterns exclude node_modules; standalone needs them.
  - from: desktop/resources/standalone
    to: standalone
    filter:
      - "**/*"
      - "**/.*"
  - from: desktop/resources/node
    to: node
    filter:
      - "**/*"

win:
  target:
    - target: portable
      arch: [x64]
mac:
  target:
    - target: zip
      arch: [x64, arm64]
linux:
  target:
    - target: AppImage
      arch: [x64]
asar: true
